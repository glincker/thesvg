<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <mask id="weave">
      <rect x="0" y="0" width="100" height="100" fill="#ffffff"/>
      <!-- crossing (60,40): B over A - cut A -->
      <line x1="53" y1="40" x2="67" y2="40" stroke="#000000" stroke-width="17"/>
      <line x1="52" y1="40" x2="68" y2="40" stroke="#ffffff" stroke-width="8"/>
      <!-- crossing (40,60): A over B - cut B -->
      <line x1="33" y1="60" x2="47" y2="60" stroke="#000000" stroke-width="17"/>
      <line x1="32" y1="60" x2="48" y2="60" stroke="#ffffff" stroke-width="8"/>
    </mask>
  </defs>
  <g fill="none" stroke="#ffffff" stroke-width="8" mask="url(#weave)">
    <rect x="15" y="15" width="45" height="45" rx="12"/>
    <rect x="40" y="40" width="45" height="45" rx="12"/>
  </g>
</svg>
