name: Moderator Application
description: Apply to become a community moderator for thesvg
labels: ["moderator-application"]
title: "Moderator application: "

body:
  - type: markdown
    attributes:
      value: |
        Thanks for your interest in helping run thesvg! Moderators get **write access**
        (labeling issues, pushing branches, reviewing and merging PRs) so they can keep
        icon requests and submissions moving without waiting on a maintainer. Infra and
        config paths (CI workflows, package.json, lockfiles, root config) always need an
        owner's review regardless, per [CODEOWNERS](https://github.com/glincker/thesvg/blob/main/.github/CODEOWNERS).
        See the "Become a Moderator" section of
        [CONTRIBUTING.md](https://github.com/glincker/thesvg/blob/main/CONTRIBUTING.md) for the full picture.

  - type: input
    id: github_username
    attributes:
      label: GitHub Username
      placeholder: e.g. octocat
    validations:
      required: true

  - type: textarea
    id: contributions
    attributes:
      label: Your contributions so far
      description: Link to icon PRs, issue triage, or discussions you've participated in.
      placeholder: |
        - PR #123: added Acme Corp icon
        - Helped triage issue #456
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Why do you want to moderate?
      description: What part of triage/review are you most interested in helping with?
    validations:
      required: true

  - type: textarea
    id: availability
    attributes:
      label: Availability
      description: Roughly how much time per week can you spend on triage/review?
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have read the Become a Moderator section of CONTRIBUTING.md
          required: true
        - label: I have at least one merged contribution or meaningful triage activity on this repo
          required: true
