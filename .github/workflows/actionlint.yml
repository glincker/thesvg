name: Actionlint

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/**"

concurrency:
  group: actionlint-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: Validate workflow files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run actionlint
        uses: reviewdog/action-actionlint@2085657ab2c7f48c58edcc767fba576f63bea76b # v1.77.0
        with:
          fail_level: error
